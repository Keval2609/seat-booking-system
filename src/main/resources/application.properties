spring.application.name=seat-booking-system

server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15432/seat_booking}
spring.datasource.username=${DB_USERNAME:seat_app}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.config.import=optional:file:.env[.properties]

spring.datasource.hikari.maximum-pool-size=20

booking.locking-strategy=NAIVE
booking.hold-ttl-seconds=300

app.jwt.secret=${JWT_SECRET}
app.jwt.ttl=PT15M
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}