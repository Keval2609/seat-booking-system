spring.application.name=seat-booking-system

server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15432/seat_booking}
spring.datasource.username=${DB_USERNAME:seat_app}
spring.datasource.password=${DB_PASSWORD:sb_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true